name: CI/CD Pipeline - Performance Monitor

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # Test and Build
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Check formatting
      run: cargo fmt -- --check
      
    - name: Run clippy
      run: cargo clippy -- -D warnings
      
    - name: Run tests
      run: cargo test --verbose
      
    - name: Build release
      run: cargo build --release
      
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: performance-monitor-binary
        path: target/release/performance-monitor

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    permissions:
      contents: read
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Display Trivy scan results
      if: always()
      run: |
        echo "## Trivy Security Scan Results" >> $GITHUB_STEP_SUMMARY
        if [ -f "trivy-results.sarif" ]; then
          echo "### SARIF file generated successfully" >> $GITHUB_STEP_SUMMARY
          echo "The SARIF file has been uploaded as an artifact for detailed analysis." >> $GITHUB_STEP_SUMMARY
          
          # Display summary if jq is available
          if command -v jq &> /dev/null; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Summary of findings:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '.runs[0].results | length' trivy-results.sarif | xargs echo "Total vulnerabilities found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "### No SARIF file generated" >> $GITHUB_STEP_SUMMARY
          echo "This might indicate no vulnerabilities were found or there was an error." >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Upload Trivy scan results as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-security-scan
        path: trivy-results.sarif
        retention-days: 30

  # Docker Build and Push
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name != 'pull_request'
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Verify Cargo.lock exists
      run: |
        echo "Checking if Cargo.lock exists..."
        ls -la Cargo.lock
        echo "Cargo.lock content (first 10 lines):"
        head -10 Cargo.lock
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          latest
          
    - name: Create production config file
      run: |
        cat > config.production.json << EOF
        {
          "monitoring": {
            "cpu_threshold": 80,
            "check_interval": 300,
            "docker_stats_timeout": 10
          },
          "email": {
            "enabled": true,
            "smtp_server": "${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}",
            "smtp_port": ${{ secrets.SMTP_PORT || '587' }},
            "sender_email": "${{ secrets.SENDER_EMAIL || 'your-email@gmail.com' }}",
            "sender_password": "${{ secrets.SENDER_PASSWORD || 'your-app-password' }}",
            "recipient_email": "${{ secrets.RECIPIENT_EMAIL || 'alert-email@example.com' }}"
          },
          "logging": {
            "level": "${{ secrets.LOG_LEVEL || 'INFO' }}",
            "file": "monitoring.log",
            "max_size_mb": 10,
            "backup_count": 5
          }
        }
        EOF
        
    - name: Upload production config as artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-config
        path: config.production.json
        
    - name: List files in build context
      run: |
        echo "Files in current directory:"
        ls -la
        echo ""
        echo "Checking if Cargo.lock exists:"
        test -f Cargo.lock && echo "Cargo.lock exists" || echo "Cargo.lock does NOT exist"
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Deploy to Production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    permissions:
      contents: read
      packages: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Download production config artifact
      uses: actions/download-artifact@v4
      with:
        name: production-config
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USER }}
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: ${{ secrets.PROD_PORT || 22 }}
        envs: GITHUB_TOKEN,GITHUB_ACTOR
        script: |
          # Debug: Verify authentication method
          echo "=== DEBUG: Authentication Method ==="
          echo "Using SSH password authentication for production deployment"
          echo "Connected to host: ${{ secrets.PROD_HOST }}"
          echo "Username: ${{ secrets.PROD_USER }}"
          echo "=================================="
          
          # Set variables
          REPO=${{ github.repository }}
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_TAG=latest
          
          # Create deployment directory if not exists
          mkdir -p ~/performance-monitor
          cd ~/performance-monitor
          
          # Create docker-compose.yml file directly
          echo "Creating docker-compose.yml for production deployment..."
          echo "version: '3.8'" > docker-compose.yml
          echo "" >> docker-compose.yml
          echo "services:" >> docker-compose.yml
          echo "  performance-monitor:" >> docker-compose.yml
          echo "    image: ghcr.io/cipta-kreasi/server-monitoring:latest" >> docker-compose.yml
          echo "    container_name: performance-monitor" >> docker-compose.yml
          echo "    restart: unless-stopped" >> docker-compose.yml
          echo "    volumes:" >> docker-compose.yml
          echo "      # Mount Docker socket for monitoring containers" >> docker-compose.yml
          echo "      - /var/run/docker.sock:/var/run/docker.sock:ro" >> docker-compose.yml
          echo "      # Mount configuration file" >> docker-compose.yml
          echo "      - ./config.production.json:/app/config.json:ro" >> docker-compose.yml
          echo "      # Mount logs directory" >> docker-compose.yml
          echo "      - ./logs:/app/logs" >> docker-compose.yml
          echo "      # Mount proc and sys for system monitoring" >> docker-compose.yml
          echo "      - /proc:/host/proc:ro" >> docker-compose.yml
          echo "      - /sys:/host/sys:ro" >> docker-compose.yml
          echo "    environment:" >> docker-compose.yml
          echo "      - RUST_LOG=info" >> docker-compose.yml
          echo "      - RUST_BACKTRACE=1" >> docker-compose.yml
          echo "    privileged: true  # Required for system monitoring" >> docker-compose.yml
          echo "    networks:" >> docker-compose.yml
          echo "      - monitoring" >> docker-compose.yml
          echo "    # Optional: Add resource limits" >> docker-compose.yml
          echo "    deploy:" >> docker-compose.yml
          echo "      resources:" >> docker-compose.yml
          echo "        limits:" >> docker-compose.yml
          echo "          cpus: '0.5'" >> docker-compose.yml
          echo "          memory: 256M" >> docker-compose.yml
          echo "        reservations:" >> docker-compose.yml
          echo "          cpus: '0.1'" >> docker-compose.yml
          echo "          memory: 128M" >> docker-compose.yml
          echo "" >> docker-compose.yml
          echo "networks:" >> docker-compose.yml
          echo "  monitoring:" >> docker-compose.yml
          echo "    driver: bridge" >> docker-compose.yml
          echo "" >> docker-compose.yml
          echo "volumes:" >> docker-compose.yml
          echo "  logs:" >> docker-compose.yml
          echo "    driver: local" >> docker-compose.yml
          
          echo "Successfully created docker-compose.yml"
          
          # Create production config file on server
          echo "Creating production config file..."
          cat > config.production.json << EOF
          {
            "monitoring": {
              "cpu_threshold": 80,
              "check_interval": 300,
              "docker_stats_timeout": 10
            },
            "email": {
              "enabled": true,
              "smtp_server": "${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}",
              "smtp_port": ${{ secrets.SMTP_PORT || '587' }},
              "sender_email": "${{ secrets.SENDER_EMAIL || 'your-email@gmail.com' }}",
              "sender_password": "${{ secrets.SENDER_PASSWORD || 'your-app-password' }}",
              "recipient_email": "${{ secrets.RECIPIENT_EMAIL || 'alert-email@example.com' }}"
            },
            "logging": {
              "level": "${{ secrets.LOG_LEVEL || 'INFO' }}",
              "file": "monitoring.log",
              "max_size_mb": 10,
              "backup_count": 5
            }
          }
          EOF
          
          echo "Production config file created successfully"
          
          # Login to GitHub Container Registry
          echo "Logging in to GitHub Container Registry..."
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          
          # Pull latest images
          docker-compose pull
          
          # Restart services
          docker-compose down
          docker-compose up -d
          
          # Wait for services to be healthy
          sleep 10
          
          # Check service status
          docker-compose ps
          
          # Show detailed logs for debugging
          echo "=== Container Status ==="
          docker ps -a | grep performance-monitor
          echo "=== Container Logs (last 50 lines) ==="
          docker-compose logs --tail=50 performance-monitor
          echo "=== Container Inspect (restart info) ==="
          docker inspect performance-monitor | grep -A10 -B5 "RestartCount\|State\|Status"
          
          echo "Deployment completed successfully!"

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    permissions:
      contents: read
      packages: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Deploy to staging server
      uses: appleboy/ssh-action@v1.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        password: ${{ secrets.STAGING_SSH_PASSWORD }}
        port: ${{ secrets.STAGING_PORT || 22 }}
        envs: GITHUB_TOKEN,GITHUB_ACTOR
        script: |
          # Debug: Verify authentication method
          echo "=== DEBUG: Authentication Method ==="
          echo "Using SSH password authentication for staging deployment"
          echo "Connected to host: ${{ secrets.STAGING_HOST }}"
          echo "Username: ${{ secrets.STAGING_USER }}"
          echo "=================================="
          
          # Set variables
          REPO=${{ github.repository }}
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_TAG=develop
          
          # Create deployment directory if not exists
          mkdir -p ~/performance-monitor-staging
          cd ~/performance-monitor-staging
          
          # Create docker-compose.yml file directly for staging
          echo "Creating docker-compose.yml for staging deployment..."
          echo "version: '3.8'" > docker-compose.yml
          echo "" >> docker-compose.yml
          echo "services:" >> docker-compose.yml
          echo "  performance-monitor:" >> docker-compose.yml
          echo "    image: ghcr.io/cipta-kreasi/server-monitoring:develop" >> docker-compose.yml
          echo "    container_name: performance-monitor-staging" >> docker-compose.yml
          echo "    restart: unless-stopped" >> docker-compose.yml
          echo "    volumes:" >> docker-compose.yml
          echo "      # Mount Docker socket for monitoring containers" >> docker-compose.yml
          echo "      - /var/run/docker.sock:/var/run/docker.sock:ro" >> docker-compose.yml
          echo "      # Mount configuration file" >> docker-compose.yml
          echo "      - ./config.staging.json:/app/config.json:ro" >> docker-compose.yml
          echo "      # Mount logs directory" >> docker-compose.yml
          echo "      - ./logs-staging:/app/logs" >> docker-compose.yml
          echo "      # Mount proc and sys for system monitoring" >> docker-compose.yml
          echo "      - /proc:/host/proc:ro" >> docker-compose.yml
          echo "      - /sys:/host/sys:ro" >> docker-compose.yml
          echo "    environment:" >> docker-compose.yml
          echo "      - RUST_LOG=info" >> docker-compose.yml
          echo "      - RUST_BACKTRACE=1" >> docker-compose.yml
          echo "    privileged: true  # Required for system monitoring" >> docker-compose.yml
          echo "    networks:" >> docker-compose.yml
          echo "      - monitoring" >> docker-compose.yml
          echo "    # Optional: Add resource limits" >> docker-compose.yml
          echo "    deploy:" >> docker-compose.yml
          echo "      resources:" >> docker-compose.yml
          echo "        limits:" >> docker-compose.yml
          echo "          cpus: '0.5'" >> docker-compose.yml
          echo "          memory: 256M" >> docker-compose.yml
          echo "        reservations:" >> docker-compose.yml
          echo "          cpus: '0.1'" >> docker-compose.yml
          echo "          memory: 128M" >> docker-compose.yml
          echo "" >> docker-compose.yml
          echo "networks:" >> docker-compose.yml
          echo "  monitoring:" >> docker-compose.yml
          echo "    driver: bridge" >> docker-compose.yml
          echo "" >> docker-compose.yml
          echo "volumes:" >> docker-compose.yml
          echo "  logs:" >> docker-compose.yml
          echo "    driver: local" >> docker-compose.yml
          
          echo "Successfully created docker-compose.yml"
          
          # Create staging config file on server
          echo "Creating staging config file..."
          cat > config.staging.json << EOF
          {
            "monitoring": {
              "cpu_threshold": 70,
              "check_interval": 60,
              "docker_stats_timeout": 5
            },
            "email": {
              "enabled": false,
              "smtp_server": "smtp.gmail.com",
              "smtp_port": "587",
              "sender_email": "your-email@gmail.com",
              "sender_password": "your-app-password",
              "recipient_email": "alert-email@example.com"
            },
            "logging": {
              "level": "DEBUG",
              "file": "monitoring.log",
              "max_size_mb": 5,
              "backup_count": 3
            }
          }
          EOF
          
          echo "Staging config file created successfully"
          
          # Login to GitHub Container Registry
          echo "Logging in to GitHub Container Registry..."
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          
          # Pull latest images
          docker-compose pull
          
          # Restart services
          docker-compose down
          docker-compose up -d
          
          # Wait for services to be healthy
          sleep 10
          
          # Check service status
          docker-compose ps
          
          echo "Staging deployment completed successfully!"

  # Notification
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, deploy-staging]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.deploy.result == 'success' || needs.deploy-staging.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        # Add your notification logic here (Slack, Discord, etc.)
        
    - name: Notify failure
      if: needs.deploy.result == 'failure' || needs.deploy-staging.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        # Add your notification logic here (Slack, Discord, etc.)